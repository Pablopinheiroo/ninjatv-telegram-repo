name: Build TelegramNinja test extension

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-test-extension.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'UmTrabalhoDoInferno/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegramninja-test-extension-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build official TDLib JNI for common Android ABIs
        env:
          TDLIB_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tdlib/td.git tdlib-source
          git -C tdlib-source checkout --detach "$TDLIB_COMMIT"
          cd tdlib-source/example/android

          # Build ARM64 (modern Android TV/phones) and ARMv7 (older 32-bit boxes).
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in arm64-v8a armeabi-v7a ; do/' build-openssl.sh
          sed -i 's/build-tdlib.sh SDK "$ANDROID_NDK_VERSION" openssl "$ANDROID_STL" "$TDLIB_INTERFACE"/build-tdlib.sh SDK "$ANDROID_NDK_VERSION" openssl "$ANDROID_STL" "$TDLIB_INTERFACE" 21 "arm64-v8a armeabi-v7a"/' Dockerfile

          docker buildx build \
            --build-arg COMMIT_HASH="$TDLIB_COMMIT" \
            --output type=local,dest="$GITHUB_WORKSPACE/tdlib-output" .

          mkdir -p "$RUNNER_TEMP/tdlib-package"
          unzip -q "$GITHUB_WORKSPACE/tdlib-output/tdlib.zip" -d "$RUNNER_TEMP/tdlib-package"

          JAVA_SOURCE="$RUNNER_TEMP/tdlib-package/tdlib/java/org/drinkless/tdlib"
          test -f "$JAVA_SOURCE/Client.java"
          test -f "$JAVA_SOURCE/TdApi.java"

          MODULE="$GITHUB_WORKSPACE/UmTrabalhoDoInferno"
          mkdir -p "$MODULE/src/main/java/org/drinkless/tdlib"
          cp "$JAVA_SOURCE"/*.java "$MODULE/src/main/java/org/drinkless/tdlib/"

          LIB_ROOT="$RUNNER_TEMP/tdlib-package/tdlib/libs"
          test -d "$LIB_ROOT/arm64-v8a"
          test -d "$LIB_ROOT/armeabi-v7a"
          mkdir -p "$MODULE/src/main/res/raw"

          python3 - "$LIB_ROOT" "$MODULE/src/main/res/raw" <<'PY'
          import pathlib, re, shutil, sys
          lib_root = pathlib.Path(sys.argv[1])
          raw_dir = pathlib.Path(sys.argv[2])
          lines = []
          for abi in ("arm64-v8a", "armeabi-v7a"):
              folder = lib_root / abi
              libraries = sorted(folder.glob("*.so"))
              if not libraries:
                  raise SystemExit(f"No native .so libraries found for {abi}")
              for library in libraries:
                  stem = library.name[:-3]
                  stem = re.sub(r"[^a-zA-Z0-9_]", "_", stem)
                  resource = f"tdlib_{abi.replace('-', '_')}_{stem}".lower()
                  shutil.copy2(library, raw_dir / f"{resource}.bin")
                  lines.append(f"{abi}|{resource}|{library.name}")
          (raw_dir / "native_manifest.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Build the CS3 test extension and repository index
        run: |
          set -euo pipefail
          gradle --no-daemon :UmTrabalhoDoInferno:make makePluginsJson
          test -s UmTrabalhoDoInferno/build/UmTrabalhoDoInferno.cs3
          mkdir -p dist
          cp UmTrabalhoDoInferno/build/UmTrabalhoDoInferno.cs3 dist/
          cp build/plugins.json dist/
          cat > dist/repo.json <<'JSON'
          {
            "name": "TelegramNinja Teste",
            "description": "Extensão experimental para testar login TDLib e o grupo Um Trabalho do Inferno.",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/Pablopinheiroo/ninjatv-telegram-repo/main/plugins.json"
            ]
          }
          JSON
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("dist/plugins.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert len(data) == 1, f"Expected exactly one test plugin, found {len(data)}"
          print("Plugin index validated:", data[0].get("name"), data[0].get("url"))
          repo = json.loads(pathlib.Path("dist/repo.json").read_text(encoding="utf-8"))
          assert repo["pluginLists"][0].endswith("/plugins.json")
          PY
          cp dist/* .

      - name: Publish the single-plugin repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UmTrabalhoDoInferno.cs3 plugins.json repo.json
          git commit -m "Build TelegramNinja group test extension" || echo "No generated changes to commit"
          git push origin HEAD:main
